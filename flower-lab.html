<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5ef" />
    <title>记忆花型试衣间</title>
    <link rel="stylesheet" href="./flower-lab.css?v=1" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CAIRN × XIAORAN · FLOWER LAB</p>
        <h1>花型试衣间</h1>
        <p>全部使用原生 Canvas 独立绘制。先只比较花的轮廓，不改现在的记忆花田。</p>
        <a href="./">回到花田</a>
      </header>
      <section class="grid">
        <article><canvas data-flower="round"></canvas><h2>01 · 圆瓣小花</h2><p>现在的基准，清楚可爱，但近看略像图标。</p></article>
        <article><canvas data-flower="bezier"></canvas><h2>02 · 贝塞尔野花</h2><p>花瓣有尖端、收腰和轻微不对称，最适合替换当前花型。</p></article>
        <article><canvas data-flower="bell"></canvas><h2>03 · 铃铛花</h2><p>花冠向下，轮廓柔软，适合少量混入而不是铺满。</p></article>
        <article><canvas data-flower="spike"></canvas><h2>04 · 穗状花</h2><p>由小花点沿主轴生长，能打破整片圆形花冠。</p></article>
        <article><canvas data-flower="stipple"></canvas><h2>05 · 点彩花</h2><p>用半透明色点叠出松散花冠，远看像水彩，近看更轻。</p></article>
      </section>
    </main>
    <script src="./flower-lab.js?v=1"></script>
  </body>
</html>
