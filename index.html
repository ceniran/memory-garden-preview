<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5ef" />
    <meta name="garden-allow-synthetic" content="true" />
    <title>我们的记忆花田 · 简易原型</title>
    <link rel="stylesheet" href="./styles.css?v=30" />
  </head>
  <body>
    <main class="garden-shell">
      <header class="intro">
        <p class="eyebrow">CAIRN × XIAORAN · MEMORY GARDEN</p>
        <div class="heading-row">
          <div>
            <h1>我们的记忆花田</h1>
            <p id="garden-caption">日子落进土地，慢慢长成我们共同生活过的样子。</p>
          </div>
          <button id="regrow" type="button" aria-label="重新生长花田">重新生长</button>
        </div>
      </header>

      <section class="calendar-panel t-acc" data-open="false" aria-label="月度记忆日历">
        <button class="calendar-summary t-acc-head" id="calendar-toggle" type="button" aria-expanded="false" aria-controls="calendar-detail">
          <span><strong id="month-label">读取月份</strong><small>点击展开月历</small></span>
          <span class="t-acc-chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 6.5L8 10.5L12 6.5"/></svg></span>
        </button>
        <div id="month-preview" class="month-preview" aria-label="本月记忆分布预览"></div>
        <div class="t-acc-panel" id="calendar-detail"><div class="t-acc-panel-inner">
          <div class="legend month-nav">
            <button id="previous-month" type="button" aria-label="上个月">←</button>
            <span class="legend-scale">安静 <i></i><i></i><i></i><i></i> 丰盛</span>
            <button id="next-month" type="button" aria-label="下个月">→</button>
          </div>
          <div class="season-preview" aria-label="季节环境预览">
            <small>仅预览环境</small><button type="button" data-season-preview="auto">随月份</button>
            <button type="button" data-season-preview="3">春</button><button type="button" data-season-preview="6">夏</button>
            <button type="button" data-season-preview="9">秋</button><button type="button" data-season-preview="0">冬</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="calendar" class="calendar" role="grid" aria-label="点击日期照亮对应记忆小花"></div>
        </div>
        </div>
      </section>

      <section class="garden-panel" aria-live="polite">
        <canvas id="garden" aria-label="由记忆日期、类型与权重生成的花田"></canvas>
      </section>

      <div class="garden-copy" aria-live="polite">
        <p id="date-label">全年记忆</p>
        <p id="memory-label">点击上方日期，看看那一天长出了什么。</p>
      </div>

      <footer class="types" aria-label="记忆类型图例">
        <span><i class="relationship"></i>关系</span>
        <span><i class="shared"></i>共同经历</span>
        <span><i class="project"></i>项目</span>
        <span><i class="reflection"></i>反思</span>
      </footer>
    </main>
    <script src="./garden.js?v=33"></script>
  </body>
</html>
